<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>PixelStore</title>
  <!--
    Arayüz tamamen yereldir. CSP, paketlenmiş origin dışına script/stil/bağlantı çıkışını engeller;
    yalnızca katalogda tanımlanabilen uzak görseller (https) resim olarak yüklenebilir.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#10101c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/pixel.css">
</head>
<body>

  <!-- Açılış perdesi: WebView ilk kareyi çizerken görünen piksel logosu. -->
  <div id="splash" class="splash" role="status" aria-label="PixelStore yükleniyor">
    <div class="splash__crest"></div>
    <div class="splash__title">PIXELSTORE</div>
    <div class="splash__bar"><span></span></div>
  </div>

  <div id="shell" class="shell is-login">
    <header id="topbar" class="topbar"></header>
    <main id="screen" class="screen-host"></main>
    <nav id="tabbar" class="tabbar" aria-label="Ana gezinme"></nav>
  </div>

  <script src="js/bridge.js"></script>
  <script src="js/pixelart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
